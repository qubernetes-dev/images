name: MinIO Docker Build and Push
run-name: MinIO Image Build and Push triggered by ${{ github.ref_name }} on ${{ github.event_name }} event

on:
  push:
    tags: [ 'minio-src-RELEASE.*Z', 'minio-src-RELEASE.*Z-r*' ]

  pull_request:
    branches: [ "main" ]
    paths:
      - 'minio/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/minio-src

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Needed to pull in the pinned minio/minio commit under minio/src.
          submodules: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=match,pattern=minio-src-(RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z-r[0-9]+)$,group=1 # revisioned tags, e.g. RELEASE.2025-04-22T22-12-26Z-r1
            type=match,pattern=minio-src-(RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z)$,group=1 # base tags, e.g. RELEASE.2025-04-22T22-12-26Z
            type=sha

      - name: Compute MinIO build metadata
        id: minio-meta
        run: |
          COMMIT_ID="$(git -C minio/src rev-parse HEAD)"
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          echo "short_commit_id=${COMMIT_ID:0:12}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME#minio-}"
          else
            RELEASE_TAG="DEVELOPMENT.${COMMIT_ID:0:12}"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          # MINIO_VERSION must be RFC3339
          DATE_PART="${RELEASE_TAG#RELEASE.}"
          DATE_PART="${DATE_PART%%-r*}"
          if [[ "$DATE_PART" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]]; then
            VERSION="$(echo "$DATE_PART" | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2})-([0-9]{2})-([0-9]{2}Z)$/\1:\2:\3/')"
            COPYRIGHT_YEAR="${DATE_PART:0:4}"
          else
            VERSION="DEVELOPMENT.GOGET"
            COPYRIGHT_YEAR="$(date -u +%Y)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "copyright_year=$COPYRIGHT_YEAR" >> "$GITHUB_OUTPUT"

      - name: Compute mc build metadata
        id: mc-meta
        run: |
          COMMIT_ID="$(git -C minio/mc-src rev-parse HEAD)"
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          echo "short_commit_id=${COMMIT_ID:0:12}" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="$(git -C minio/mc-src describe --tags --exact-match 2>/dev/null || true)"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="DEVELOPMENT.${COMMIT_ID:0:12}"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          DATE_PART="${RELEASE_TAG#RELEASE.}"
          DATE_PART="${DATE_PART%%-r*}"
          if [[ "$DATE_PART" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$ ]]; then
            VERSION="$(echo "$DATE_PART" | sed -E 's/^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2})-([0-9]{2})-([0-9]{2}Z)$/\1:\2:\3/')"
            COPYRIGHT_YEAR="${DATE_PART:0:4}"
          else
            VERSION="DEVELOPMENT.GOGET"
            COPYRIGHT_YEAR="$(date -u +%Y)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "copyright_year=$COPYRIGHT_YEAR" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: ./minio
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINIO_VERSION=${{ steps.minio-meta.outputs.version }}
            MINIO_RELEASE_TAG=${{ steps.minio-meta.outputs.release_tag }}
            MINIO_COMMIT_ID=${{ steps.minio-meta.outputs.commit_id }}
            MINIO_SHORT_COMMIT_ID=${{ steps.minio-meta.outputs.short_commit_id }}
            MINIO_COPYRIGHT_YEAR=${{ steps.minio-meta.outputs.copyright_year }}
            RELEASE=${{ steps.minio-meta.outputs.release_tag }}
            MC_VERSION=${{ steps.mc-meta.outputs.version }}
            MC_RELEASE_TAG=${{ steps.mc-meta.outputs.release_tag }}
            MC_COMMIT_ID=${{ steps.mc-meta.outputs.commit_id }}
            MC_SHORT_COMMIT_ID=${{ steps.mc-meta.outputs.short_commit_id }}
            MC_COPYRIGHT_YEAR=${{ steps.mc-meta.outputs.copyright_year }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
